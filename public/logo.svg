<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="RLES 2v2">
  <defs>
    <linearGradient id="rlesFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f2f2f2"/>
      <stop offset="100%" stop-color="#cfcfcf"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="58%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#003d80" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g transform="translate(360 140) skewX(-12) rotate(-4) translate(-360 -140)" filter="url(#softShadow)">
    <!-- Outer blue border shell -->
    <path
      d="M48 62
         C48 42 64 28 86 28
         H545
         C575 28 598 52 592 82
         L560 232
         C554 258 530 276 502 276
         H112
         C82 276 56 252 62 222
         Z"
      fill="#007BFF"
    />

    <!-- Black outline plate -->
    <path
      d="M68 74
         C68 58 80 48 98 48
         H528
         C552 48 568 68 562 92
         L534 214
         C528 234 510 248 488 248
         H128
         C104 248 86 228 92 204
         Z"
      fill="#000000"
    />

    <!-- RLES wordmark -->
    <text
      x="118"
      y="168"
      font-family="Arial Black, Impact, Haettenschweiler, sans-serif"
      font-size="118"
      font-weight="900"
      letter-spacing="-4"
      fill="url(#rlesFace)"
    >RLES</text>
    <text
      x="118"
      y="168"
      font-family="Arial Black, Impact, Haettenschweiler, sans-serif"
      font-size="118"
      font-weight="900"
      letter-spacing="-4"
      fill="url(#shine)"
    >RLES</text>

    <!-- 2v2 brush accent -->
    <text
      x="390"
      y="236"
      font-family="Brush Script MT, Segoe Script, Comic Sans MS, cursive"
      font-size="72"
      font-weight="700"
      fill="#8A2BE2"
      stroke="#000000"
      stroke-width="10"
      paint-order="stroke fill"
      transform="rotate(-6 430 220)"
    >2v2</text>
  </g>
</svg>
